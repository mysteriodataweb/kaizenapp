[project]
name = "opportunity-intelligence-api"
version = "1.0.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["E501", "S101", "S311", "B008", "SIM108", "S105", "S106", "B904"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B017"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
