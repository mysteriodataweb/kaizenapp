# Blueprint Render — Opportunity Intelligence (backend FastAPI + tâches planifiées)
# Aucune valeur secrète ici : DATABASE_URL, RESEND_API_KEY, etc. sont saisies dans le
# dashboard Render (groupe d'environnement « opportunity-intelligence-shared »).
# Voir docs/DEPLOYMENT.md.

envVarGroups:
  - name: opportunity-intelligence-shared
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: SECRET_KEY
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
      - key: DEFAULT_TIMEZONE
        value: Europe/Paris
      - key: STORAGE_PROVIDER
        value: none
      - key: MAX_UPLOAD_MB
        value: "4"
      # À AJOUTER dans le dashboard (Env Groups) après création du Blueprint :
      #   DATABASE_URL            (Neon, chaîne « pooled »)
      #   DATABASE_MIGRATION_URL  (Neon, chaîne directe — recommandé pour Alembic)
      #   FRONTEND_URL            (URL Vercel de production)
      #   CORS_ORIGINS            (URL Vercel de production)
      #   RESEND_API_KEY, EMAIL_FROM, ALERT_RECIPIENT   (facultatif : sinon mode simulation)
      #   AI_PROVIDER, AI_API_KEY                       (facultatif)
      #   STORAGE_PROVIDER=s3 + STORAGE_BUCKET/ENDPOINT_URL/ACCESS_KEY/SECRET_KEY (facultatif)
      #   BOOTSTRAP_ADMIN_EMAIL / BOOTSTRAP_ADMIN_PASSWORD (une seule fois, puis supprimer le mot de passe)

services:
  - type: web
    name: opportunity-intelligence-api
    runtime: python
    rootDir: backend
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    # Migrations (idempotentes) + sources par défaut + amorçage admin unique, puis l'API.
    startCommand: >-
      alembic upgrade head &&
      python -m app.cli seed-sources &&
      python -m app.cli bootstrap-admin &&
      uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - fromGroup: opportunity-intelligence-shared

  # ---------------------------------------------------------------------------
